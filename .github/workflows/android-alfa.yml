name: Android Alfa APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-alfa.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK de prueba
        working-directory: android-app
        run: set -o pipefail; gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee android-build.log
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      - name: Registrar diagnóstico si falla
        if: failure()
        working-directory: android-app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f android-build.log ]; then
            tail -n 100 android-build.log > android-build-tail.txt
          else
            echo "La compilación falló antes de ejecutar Gradle. Revisar los pasos anteriores de GitHub Actions." > android-build-tail.txt
          fi
          gh issue create --title "Diagnóstico automático Android Alfa #${{ github.run_number }}" --body-file android-build-tail.txt || true
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: notas-voz-android-alfa
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
