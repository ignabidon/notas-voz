name: Verificar Grabador de voz Delta

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba-estatica:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar código
        run: node --test tests/delta.test.mjs
      - name: Entrega 2 - borradores confirmados y notas solo audio
        run: node --test tests/entrega2.test.mjs
      - name: Verificar interfaz en Chrome (estados simulados)
        run: node tests/browser.mjs
        timeout-minutes: 3
      - name: Verificar protección cifrada en Chrome (huella simulada)
        run: node tests/cifrado-browser.mjs
        timeout-minutes: 4
      - name: Verificar audio por nota E1 en Chrome (apagado, datos ficticios)
        run: node tests/audio-nota-browser.mjs
        timeout-minutes: 3
      - name: Verificar audio cifrado por nota E2 en Chrome (tono sintético, datos ficticios)
        run: node tests/audio-cifrado-browser.mjs
        timeout-minutes: 4
      - name: Verificar correcciones de E2 en Chrome (dos pestañas, sin espacio, notas A y B, cortes; datos ficticios)
        run: node tests/e2-correcciones-browser.mjs
        timeout-minutes: 5
      - name: Verificar segunda revisión de E2 en Chrome (candado entre pestañas, borrador viejo, audio dañado, ficha final y borrado; datos ficticios)
        run: node tests/e2-revision2-browser.mjs
        timeout-minutes: 6
      - name: Verificar copia cifrada K1 en Chrome (crear y verificar, datos ficticios)
        run: node tests/copia-browser.mjs
        timeout-minutes: 4
      - name: Verificar pantalla Notas en Chrome (hojas y mensajes, datos ficticios)
        run: node tests/notas-browser.mjs
        timeout-minutes: 4
      - name: Verificar lectura y edición móvil en Chrome (estados simulados)
        run: node tests/editor-browser.mjs
        timeout-minutes: 4


      - name: Verificar reproductor E3 y almacenamiento
        run: node tests/e3-browser.mjs
        timeout-minutes: 4
      - name: Ensayar biblioteca unificada y respaldo formato 2 (no activados)
        run: node tests/p2-biblioteca-browser.mjs
        timeout-minutes: 5

      - name: K2 - restaurar copia sintética en instalación vacía de Chrome
        run: node tests/k2-browser.mjs
        timeout-minutes: 6
      - name: K2 · candado universal entre pestañas, lotes alterados, cuota por fase y cortes reales (datos ficticios)
        run: node tests/k2-candado-browser.mjs
        timeout-minutes: 6
      - name: K2 de reemplazo - reglas del código (Node)
        run: node --test tests/k2-reemplazo.test.mjs
      - name: K2 de reemplazo · respaldo previo, doble confirmación, cortes en cada paso, espacio y audio sin cifrar que se cifra (datos ficticios)
        run: node tests/k2-reemplazo-browser.mjs
        timeout-minutes: 10
      - name: U12 elegir cuaderno y nombre desde Dictar (Chrome, 360 px, datos ficticios)
        run: node tests/dictar-destino-browser.mjs
        timeout-minutes: 6
      - name: U16 rediseño de Ajustes (Chrome, 360 px, datos ficticios)
        run: node tests/ajustes-browser.mjs
        timeout-minutes: 8
      - name: U5 estética y modo nocturno (Chrome, 360 px, contrastes, datos ficticios)
        run: node tests/apariencia-browser.mjs
        timeout-minutes: 8
      - name: Correcciones PR 60 - inventario, exclusiones, copias mezcladas y cortes (Node)
        run: node --test tests/p2-correcciones.test.mjs
      - name: Correcciones PR 60 en Chrome (guarda, panel, copia 1 con avisos, copia 2 mezclada; datos ficticios)
        run: node tests/p2-correcciones-browser.mjs
        timeout-minutes: 5
      - name: Capa única de registros cifrados - prueba estática y almacén falso (Node)
        run: node --test tests/capa-registros.test.mjs
      - name: "Capa única de registros cifrados en Chrome (almacén falso: protección, copia, verificación y restauración K2; datos ficticios)"
        run: node tests/capa-registros-browser.mjs
        timeout-minutes: 5
